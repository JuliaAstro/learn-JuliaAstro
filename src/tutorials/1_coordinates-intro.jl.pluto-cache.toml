text_representation = """<div class=\"markdown\"><p>In astropy, the coordinate frame is specified with a keyword argument &#40;with ICRS as the default&#41;. In SkyCoords.jl, the frame <em>is</em> the type — every subtype of <code>AbstractSkyCoords</code> &#40;<code>ICRSCoords</code>, <code>GalCoords</code>, <code>FK5Coords</code>, ...&#41; names its frame explicitly — so there is no default frame to remember. As we will see later on in this series, there are many other supported coordinate frames.</p>\n<p>In the above initialization, we passed in degree quantities from DynamicQuantities.jl &#40;<a href=\"https://symbolicml.org/DynamicQuantities.jl/stable/\">docs</a>&#41; to specify the angular components of our sky coordinate. Under the hood, <code>ICRSCoords</code> stores these components as unitless radians. We can also create the same object from string-formatted coordinates using the string macros from AstroAngles.jl &#40;<a href=\"https://juliaastro.org/AstroAngles/stable/\">docs</a>&#41;. For example, if we have sexagesimal sky coordinate data where the representation of the data includes specifications of the units &#40;the &quot;hms&quot; for &quot;hour minute second&quot;, and the &quot;dms&quot; for &quot;degrees minute second&quot;&#41;:</p>\n</div>"""

