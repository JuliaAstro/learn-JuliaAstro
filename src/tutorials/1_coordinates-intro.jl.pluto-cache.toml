text_representation = """<div class=\"markdown\"><p>With the table of <em>Gaia</em> data we retrieved above for stars around NGC 188, <code>ngc188_table</code>, we also have parallax measurements for each star. For a precisely-measured parallax <span class=\"tex\">$\\varpi$</span>, the distance <span class=\"tex\">$d$</span> to a star can be obtained approximately as <span class=\"tex\">$d \\approx 1/\\varpi$</span>. This only really works if the parallax error is small relative to the parallax &#40;<a href=\"https://arxiv.org/abs/1507.02105\">see discussion in this paper</a>&#41;, so if we want to use these parallaxes to get distances we first have to filter out stars that have low signal-to-noise parallaxes. Some sources in our table have no parallax measurement at all &#40;the <em>Gaia</em> archive returns an empty value, which CSV.jl reads in as <code>missing</code>&#41;, so we drop those rows first:</p>\n</div>"""

