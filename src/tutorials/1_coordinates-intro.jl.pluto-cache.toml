text_representation = """<div class=\"markdown\"><p>In this tutorial, we have introduced SkyCoords.jl and AstroAngles.jl as a way to store, represent, and format astronomical sky coordinates. We used coordinate objects to parse and change coordinate representations and units. We also demonstrated how to use a coordinate object to query an astronomical database, the <em>Gaia</em> science archive, directly over TAP/ADQL with VirtualObservatory.jl. We then created a vector of coordinate objects from the queried data to represent the sky coordinates of many objects. Finally, we introduced the concept of combining Cartesian direction vectors with distances to represent the 3D position of an object or set of objects.</p>\n</div>"""

