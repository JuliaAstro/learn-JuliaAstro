text_representation = """<div class=\"markdown\"><h1 id=\"Astronomical-Coordinates-1:-Getting-Started-with-SkyCoords.jl\">Astronomical Coordinates 1: Getting Started with SkyCoords.jl</h1>\n<p>This notebook is modified from <a href=\"https://learn.astropy.org/tutorials/1_Coordinates-Intro.html\">https://learn.astropy.org/tutorials/1_Coordinates-Intro.html</a></p>\n<p><em>Original authors: Adrian Price-Whelan</em></p>\n<div class=\"admonition tip\"><p class=\"admonition-title\">Learning Goals</p><ul>\n<li><p>Create sky coordinate objects in SkyCoords.jl using coordinate data and object names</p>\n</li>\n<li><p>Use a sky coordinate object to query the <em>Gaia</em> archive directly from Julia</p>\n</li>\n<li><p>Output coordinate data in different string representations with AstroAngles.jl</p>\n</li>\n<li><p>Demonstrate working with 3D sky coordinates &#40;including distance information for objects&#41;</p>\n</li>\n</ul>\n</div>\n<div class=\"admonition note\"><p class=\"admonition-title\">Keywords</p><p><code>coordinates</code> <code>gaia</code></p>\n</div>\n\n</div>"""
