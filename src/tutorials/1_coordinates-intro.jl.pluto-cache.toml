text_representation = """<div class=\"markdown\"><p>For the initializations demonstrated above, we assumed that we already had the coordinate component values ready. If you do not know the coordinate values and the object you are interested in is in <a href=\"https://simbad.u-strasbg.fr/simbad/\">SIMBAD</a>, you can also automatically look up and load coordinate values from the name of the object. SkyCoords.jl does not ship a convenience function for this &#40;yet&#33;&#41;, but VirtualObservatory.jl &#40;<a href=\"https://github.com/JuliaAPlavin/VirtualObservatory.jl\">docs</a>&#41; makes rolling our own a one-query affair: SIMBAD exposes a Table Access Protocol &#40;TAP&#41; service — available in VirtualObservatory.jl as the built-in <code>:simbad</code> service — that we can query by object identifier &#40;<a href=\"https://simbad.cds.unistra.fr/simbad/sim-tap/\">more on SIMBAD TAP</a>&#41;:</p>\n<div class=\"admonition todo\"><p class=\"admonition-title\">Todo</p><p>Add a <code>from_name</code>-style lookup convenience function to SkyCoords.jl</p>\n</div>\n</div>"""

