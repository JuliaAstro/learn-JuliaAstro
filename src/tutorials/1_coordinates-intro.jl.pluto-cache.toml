text_representation = """<div class=\"markdown\"><h2 id=\"Representing-On-sky-Positions-with-SkyCoords.jl\">Representing On-sky Positions with SkyCoords.jl</h2>\n<p>In Julia, the most common way of representing and working with sky coordinates is to use objects from the SkyCoords.jl package &#40;<a href=\"https://juliaastro.org/SkyCoords/stable/\">docs</a>&#41;. A sky coordinate can be created directly from angles, as demonstrated below.</p>\n<p>To get started, let&#39;s assume that we want to create a sky coordinate object for the center of the open star cluster NGC 188 so that later we can query and retrieve stars that might be members of the cluster. Let&#39;s also assume, for now, that we already know the sky coordinates of the cluster to be <code>&#40;12.11, 85.26&#41;</code> degrees in the ICRS coordinate frame. The ICRS — sometimes referred to as &quot;equatorial&quot; or &quot;J2000&quot; coordinates &#40;<a href=\"https://arxiv.org/abs/astro-ph/0602086\">more info about the ICRS</a>&#41; — is currently the most common astronomical coordinate frame for stellar or extragalactic astronomy. Since we already know the ICRS position of NGC 188 &#40;see above&#41;, we can create an <a href=\"https://juliaastro.org/SkyCoords/stable/api/#SkyCoords.ICRSCoords\"><code>ICRSCoords</code></a> object for the cluster:</p>\n</div>"""

