text_representation = """<div class=\"markdown\"><h2 id=\"More-Than-Just-Sky-Positions:-Including-Distance-Information\">More Than Just Sky Positions: Including Distance Information</h2>\n<p>So far, we have only used our coordinate objects to represent angular sky positions &#40;i.e., <code>ra</code> and <code>dec</code> only&#41;. It is sometimes useful to include distance information with the sky coordinates of a source, thereby specifying the full 3D position of an object. SkyCoords.jl does not &#40;yet&#41; accept a <code>distance</code> keyword argument like astropy&#39;s <code>SkyCoord</code> does, but we can compose the same information ourselves: the <code>cartesian</code> function converts a coordinate object to a direction vector on the &#40;dimensionless&#41; unit sphere, and scaling that vector by a distance gives the full 3D position. So, if we knew that the distance to NGC 188 is 1.96 kpc, we could compute its 3D Cartesian position like so:</p>\n<div class=\"admonition todo\"><p class=\"admonition-title\">Todo</p><ul>\n<li><p>Add <code>distance</code> kwarg to <code>AbstractSkyCoords</code> constructors</p>\n</li>\n<li><p>Document <code>cartesian</code> and <code>spherical</code> <a href=\"https://github.com/JuliaAstro/SkyCoords.jl/issues/84\">#84</a></p>\n</li>\n</ul>\n</div>\n</div>"""

