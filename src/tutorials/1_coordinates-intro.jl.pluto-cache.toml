text_representation = """<div class=\"markdown\"><p>The above selection keeps stars that have a ~10-sigma parallax measurement, but this is an arbitrary selection threshold that you may want to tune or remove in your own use cases. This selection removed over half of the stars in our original table, but for the remaining stars we can be confident that converting the parallax measurements to distances is mostly safe.</p>\n<p>astropy provides a specialized <code>Distance</code> class for handling common transformations of different distance representations. In Julia, this is just a short function away: the catalog of stars we queried from <em>Gaia</em> contains parallax information in milliarcsecond units, and a parallax <span class=\"tex\">$\\varpi$</span> in milliarcseconds corresponds to a distance <span class=\"tex\">$d &#61; 1000 / \\varpi$</span> in parsecs:</p>\n<div class=\"admonition todo\"><p class=\"admonition-title\">Todo</p><p>Add support for <code>mas</code> &#40;milliarcsecond&#41; angle units and a parallax-based distance convenience</p>\n</div>\n</div>"""

