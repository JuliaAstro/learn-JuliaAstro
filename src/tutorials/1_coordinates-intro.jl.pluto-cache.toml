text_representation = """<div class=\"markdown\"><h2 id=\"Querying-the-Gaia-Archive-to-Retrieve-Coordinates-of-Stars-in-NGC-188\">Querying the <em>Gaia</em> Archive to Retrieve Coordinates of Stars in NGC 188</h2>\n<p>Now that we have a coordinate object for the center of NGC 188, we can query many different astronomical databases directly from Julia. Here, we will use <code>ngc188_center</code> to select sources from the <em>Gaia</em> Data Release 2 catalog around the position of the center of NGC 188 to look for stars that might be members of the star cluster. Like SIMBAD above, the <em>Gaia</em> archive speaks TAP &#40;<a href=\"https://www.cosmos.esa.int/web/gaia-users/archive/programmatic-access\">docs</a>&#41; — VirtualObservatory.jl ships it as the built-in <code>:gaia</code> service — so we can express our cone search in ADQL &#40;an SQL dialect for astronomy&#41; and let <code>execute</code> handle the rest.</p>\n<p>In the query below, the <code>CONTAINS</code>/<code>CIRCLE</code> condition selects sources within 0.5 degrees of the cluster center, <code>TOP 10000</code> limits the number of returned rows, and <code>ORDER BY dist</code> keeps the sources closest to the center if that limit kicks in. Note how we can interpolate the components of <code>ngc188_center</code> directly into the query string:</p>\n</div>"""

