text_representation = """<div class=\"markdown\"><h2 id=\"Summary\">Summary</h2>\n<p>Astronomers use a wide variety of coordinate systems and formats to represent sky coordinates of celestial objects. For example, you may have seen terms like &quot;right ascension&quot; and &quot;declination&quot; or &quot;galactic latitude and longitude,&quot; and you may have seen angular coordinate components represented as <code>0h39m15.9s</code>, <code>00:39:15.9</code>, or <code>9.81625°</code>. The JuliaAstro packages SkyCoords.jl &#40;<a href=\"https://juliaastro.org/SkyCoords/stable/\">docs</a>&#41; and AstroAngles.jl &#40;<a href=\"https://juliaastro.org/AstroAngles/stable/\">docs</a>&#41; provide tools for representing the coordinates of objects and transforming them between different systems.</p>\n<p>In this tutorial, we will explore how these packages can be used to work with astronomical coordinates in Julia. You may find it helpful to keep the documentation linked above open alongside this tutorial for reference or additional reading. In the text below, you may also see some links that look like &#40;<a href=\"https://juliaastro.org/SkyCoords/stable/\">docs</a>&#41;. These links will take you to parts of the documentation that are directly relevant to the cells from which they link.</p>\n<p><em>Note: This is the 1st tutorial in a series of tutorials about coordinates in Julia.</em></p>\n</div>"""

