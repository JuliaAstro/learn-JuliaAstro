name: Export learn.JuliaAstro notebooks & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
# Skip intermediate builds: always.
# Cancel intermediate builds: only if it is a pull request build
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 120 # fail fast if a data archive stalls, instead of the 6 hour default
    if: github.event.pull_request.draft == false # don't run on draft PRs
    permissions:
      contents: write   # push to gh-pages (main site + PR previews)
      statuses: write   # add the preview link to the PR's checks
    steps:
      - name: Checkout learn.JuliaAstro source
        uses: actions/checkout@v7

      - name: 🙌 Install Julia
        uses: julia-actions/setup-julia@v3
        with:
          version: "1.13"

      - name: ⏱ Cache notebook states
        uses: actions/cache@v6
        with:
          path: _cache
          key: ${{ runner.os }}-pluto_state_cache-v3-${{ hashFiles('**/Project.toml', '**/Manifest.toml') }}-${{ github.run_id }}
          restore-keys: ${{ runner.os }}-pluto_state_cache-v3-${{ hashFiles('**/Project.toml', '**/Manifest.toml') }}

      - name: ⏱ Cache .julia
        uses: actions/cache@v6
        with:
          path: ~/.julia
          key: ${{ runner.os }}-dotjulia-v1-${{ hashFiles('**/Project.toml', '**/Manifest.toml') }}-${{ github.run_id }}
          restore-keys: ${{ runner.os }}-dotjulia-v1-${{ hashFiles('**/Project.toml', '**/Manifest.toml') }}

      # Data files downloaded by the notebooks (gitignored)
      - name: ⏱ Restore tutorial data
        id: data-cache
        uses: actions/cache/restore@v6
        with:
          path: src/tutorials/data
          key: ${{ runner.os }}-tutorial-data-v1-${{ github.run_id }}
          restore-keys: ${{ runner.os }}-tutorial-data-v1-

      - name: 🙌 Install dependencies
        shell: julia --project {0}
        run: import Pkg; Pkg.instantiate()

      # Notebooks that install packages with `Pkg.activate` don't record package versions in their
      # file, so their saved outputs can go stale. Delete those outputs so these notebooks always re-run.
      # Notebooks that use Pluto's built-in package manager are pinned, so their saved outputs are reused.
      - name: 🧹 Drop saved outputs of unpinned notebooks
        shell: julia --project {0}
        run: |
          import PlutoPages, Pluto
          const PSS = PlutoPages.PlutoSliderServer
          for (root, _, files) in walkdir("src"), f in files
              path = joinpath(root, f)
              if endswith(f, ".jl") && Pluto.is_pluto_notebook(path) && !Pluto.PkgUtils.will_use_pluto_pkg(path)
                  rm(PSS.cache_filename(abspath("_cache"), PSS.plutohash(read(path, String))); force = true)
              end
          end

      - name: 🪴 Generate site
        shell: julia --project {0}
        run: |
          import PlutoPages
          PlutoPages.generate("."; html_report_path="generation_report.html")
        env:
          JULIA_PKG_SERVER: ""

      # Save only when the set of data files changed. Runs even if a notebook failed, so
      # finished downloads are kept, but not for cancelled runs, which can leave a partial file.
      - name: ⏱ Save tutorial data
        if: ${{ !cancelled() && steps.data-cache.outputs.cache-matched-key != format('{0}-tutorial-data-v1-{1}', runner.os, hashFiles('src/tutorials/data/**')) }}
        uses: actions/cache/save@v6
        with:
          path: src/tutorials/data
          key: ${{ runner.os }}-tutorial-data-v1-${{ hashFiles('src/tutorials/data/**') }}

      - name: 📰 Upload site generation report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          path: generation_report.html

      - name: 🚀 Deploy to GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: gh-pages
          folder: _site
          clean-exclude: |
            previews/**
            CNAME

      - name: 🌐 Deploy PR preview
        if: github.event_name == 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: gh-pages
          folder: _site
          target-folder: previews/PR${{ github.event.pull_request.number }}
          clean: false   # don't touch the live site or other previews
          commit-message: "Deploy preview for PR #${{ github.event.pull_request.number }}"

      - name: 🔗 Add preview link to PR checks
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const pr = context.payload.pull_request.number;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.payload.pull_request.head.sha,
              state: "success",
              context: "preview / learn.juliaastro.org",
              target_url: `https://learn.juliaastro.org/previews/PR${pr}/`,
              description: "Preview deployed — click Details",
            });
